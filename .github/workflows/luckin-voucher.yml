name: Daily Luckin Voucher

on:
  schedule:
    - cron: "7 2 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Claim voucher
        env:
          LUCKIN_PHONE: ${{ secrets.LUCKIN_PHONE }}
          VOUCHER_SCREENSHOT_PATH: artifacts/voucher-success.png
        run: npm run claim

      - name: Upload voucher screenshot
        uses: actions/upload-artifact@v4
        with:
          name: luckin-voucher-screenshot-${{ github.run_number }}
          path: artifacts/voucher-success.png
          if-no-files-found: error
          retention-days: 30
